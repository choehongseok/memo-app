name: Preparation checks
on:
  push:
    branches: [main, preparation/stage-0]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_trial:
        description: 'Explicit trial upload only after confirming shared artifact storage allowance; may incur storage charges'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-skeleton:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - name: Install fixed official SDK with SHA512 validation
        shell: pwsh
        run: |
          $metadata = Invoke-RestMethod 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          $sdk = @($metadata.releases | ForEach-Object { $_.sdk } | Where-Object { $_.version -eq '10.0.401' })[0]
          $file = @($sdk.files | Where-Object { $_.rid -eq 'win-x64' -and $_.name.EndsWith('.zip') })[0]
          if (!$file) { throw 'Exact SDK archive not found' }
          $archive = Join-Path $env:RUNNER_TEMP 'memo-sdk.zip'
          $sdkDir = Join-Path $env:RUNNER_TEMP 'memo-dotnet'
          Invoke-WebRequest $file.url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $file.hash.ToLowerInvariant()) { throw 'SDK hash mismatch' }
          Expand-Archive $archive -DestinationPath $sdkDir
          $sdkDir | Out-File $env:GITHUB_PATH -Append
          "DOTNET_ROOT=$sdkDir" | Out-File $env:GITHUB_ENV -Append
          "DOTNET_CLI_TELEMETRY_OPTOUT=1" | Out-File $env:GITHUB_ENV -Append
          "DOTNET_NOLOGO=1" | Out-File $env:GITHUB_ENV -Append
      - name: Record environment and commit
        shell: pwsh
        run: |
          dotnet --info
          git rev-parse HEAD
      - name: Record optional installed Microsoft MSI validation tools
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}\Windows Kits", "$env:ProgramFiles\Windows Kits") | Select-Object -Unique
          $names = @('msival2.exe', 'darice.cub', 'evalcom2.dll', 'orca.exe')
          $found = @()
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $found += Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction Stop | Where-Object { $_.Name -in $names }
            }
          }
          if ($found.Count -eq 0) { Write-Output 'No native MSI ICE tool set found in installed Windows Kits; no SDK installed and no MSI executed' }
          foreach ($file in ($found | Select-Object -First 50)) {
            Write-Output "MSI tool inventory: $($file.FullName)"
            if ($file.Extension -in @('.exe', '.dll')) {
              $signature = Get-AuthenticodeSignature -FilePath $file.FullName
              Write-Output "MSI tool signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          }
      - name: Scope and safety checks
        shell: pwsh
        run: |
          python -c "import hashlib, pathlib, subprocess; p='docs/SOURCE_PROMPT.txt'; blob=subprocess.check_output(['git','show','HEAD:'+p]); checkout=pathlib.Path(p).read_bytes(); print('source blob:',len(blob),hashlib.sha256(blob).hexdigest()); print('source checkout:',len(checkout),hashlib.sha256(checkout).hexdigest()); assert blob==checkout, 'Source checkout differs from Git blob'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_preparation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_commit_safety.py
          exit $LASTEXITCODE
      - name: Build Windows skeleton
        run: dotnet build MemoApp.slnx -c Release
      - name: Synthetic contract checks
        run: dotnet run --project tests/MemoApp.ContractChecks -c Release --no-build
      - name: Actual Windows WPF synthetic control checks
        run: dotnet run --project tests/MemoApp.WindowsChecks -c Release --no-build
      - name: Publish unsigned synthetic-data Windows x64 trial
        run: dotnet publish src/MemoApp.Windows -c Release -r win-x64 --self-contained true -o artifacts/windows-x64-synthetic-trial
      - name: Package bounded per-user installation payload
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/windows-x64-synthetic-trial/README.txt
          python tools/package_trial.py artifacts/windows-x64-synthetic-trial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node24
        if: github.event_name == 'workflow_dispatch' && inputs.upload_trial
        with:
          name: windows-x64-synthetic-trial
          path: artifacts/windows-x64-synthetic-trial
          retention-days: 7
